<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Pilot Bot</title>
    <style>
        /* --- iOS DESIGN SYSTEM (HUMAN INTERFACE GUIDELINES) --- */
        :root {
            --ios-bg: #F2F2F7;
            --ios-card: #FFFFFF;
            --ios-text: #000000;
            --ios-subtext: #8E8E93;
            --ios-accent: #007AFF;
            --ios-green: #34C759;
            --ios-red: #FF3B30;
            --ios-gold: #FFCC00;
            --ios-segmented-bg: rgba(118, 118, 128, 0.12);
            --ios-border: rgba(60, 60, 67, 0.12);
            --ios-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            --ios-tabbar-bg: rgba(249, 249, 249, 0.85);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--ios-bg);
            color: var(--ios-text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0 16px 90px 16px;
            -webkit-font-smoothing: antialiased;
        }

        /* --- HEADER & TITLES --- */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 10px 0;
        }

        .app-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .badge-online {
            background: rgba(52, 199, 89, 0.12);
            color: var(--ios-green);
            font-size: 13px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* --- SEGMENTED CONTROL (IOS MENU TABS) --- */
        .segmented-control {
            background: var(--ios-segmented-bg);
            padding: 2px;
            border-radius: 9px;
            display: flex;
            margin-bottom: 16px;
        }

        .segment-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 8px 0;
            font-size: 13px;
            font-weight: 600;
            color: var(--ios-text);
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .segment-btn.active {
            background: #FFFFFF;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        /* --- CARDS & LISTS --- */
        .ios-card {
            background: var(--ios-card);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--ios-shadow);
            border: 0.5px solid var(--ios-border);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 17px;
            font-weight: 600;
            margin: 0;
        }

        .action-group {
            display: flex;
            gap: 8px;
        }

        /* --- BUTTONS --- */
        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: var(--ios-segmented-bg);
            color: var(--ios-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
        }

        .icon-btn.btn-del {
            color: var(--ios-red);
            background: rgba(255, 59, 48, 0.1);
        }

        .submit-btn {
            background-color: var(--ios-accent);
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            padding: 14px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
        }

        /* --- INPUTS --- */
        .ios-input {
            width: 100%;
            background: var(--ios-segmented-bg);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 15px;
            color: var(--ios-text);
            outline: none;
            margin-bottom: 10px;
        }

        /* --- PROGRESS BAR --- */
        .progress-line-container {
            background: var(--ios-segmented-bg);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            flex: 1;
        }

        .progress-line-bar {
            background-color: var(--ios-accent);
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .progress-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--ios-subtext);
        }

        /* --- BOTTOM TAB BAR (NAVBAR) --- */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: var(--ios-tabbar-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 0.5px solid var(--ios-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 10px;
            z-index: 999;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: var(--ios-subtext);
            font-size: 10px;
            font-weight: 500;
            gap: 4px;
            cursor: pointer;
        }

        .tab-item.active {
            color: var(--ios-accent);
        }

        .tab-item .icon {
            font-size: 20px;
        }

        /* --- SCREENS --- */
        .screen { display: none; }
        .screen.active { display: block; }

        /* Loader */
        .loader { text-align: center; color: var(--ios-subtext); padding: 20px; }
    </style>
</head>
<body>

    <!-- SECTION: KUTUBXONA (LIBRARY) -->
    <div id="screen-library" class="screen active">
        <div class="app-header">
            <h1 class="app-title">Kutubxona</h1>
            <span class="badge-online" id="user-count-badge">🟢 0 faol</span>
        </div>

        <div class="segmented-control">
            <button class="segment-btn active" onclick="switchTab(this, 'tests')">❓ Testlar</button>
            <button class="segment-btn" onclick="switchTab(this, 'public')">🌐 Ommaviy</button>
            <button class="segment-btn" onclick="switchTab(this, 'cards')">📁 Kartochkalar</button>
        </div>

        <div id="lib-content-area"></div>
    </div>

    <!-- SECTION: YARATISH (CREATE) -->
    <div id="screen-create" class="screen">
        <div class="app-header">
            <h1 class="app-title">Yaratish</h1>
        </div>

        <div class="ios-card">
            <input type="text" id="quiz-title-input" class="ios-input" placeholder="Test nomi...">
            <textarea id="text-input" class="ios-input" rows="5" placeholder="Matnni shu yerga joylang..."></textarea>
            <input type="file" id="file-input" style="display:none;" onchange="updateFileName(this)">
            <button class="ios-input" style="text-align:left; color:var(--ios-subtext);" onclick="document.getElementById('file-input').click()">
                📎 <span id="upload-text">Fayl biriktirish (PDF, DOCX)...</span>
            </button>
            <button class="submit-btn" onclick="startGeneration()">Generatsiya qilish ✨</button>
        </div>
    </div>

    <!-- SECTION: SOZLAMALAR (SETTINGS) -->
    <div id="screen-settings" class="screen">
        <div class="app-header">
            <h1 class="app-title">Sozlamalar</h1>
        </div>
        <div class="ios-card">
            <p style="font-weight:600; margin-top:0;">Tizim tilini tanlang:</p>
            <button class="ios-input" style="text-align:left;" onclick="setLanguage('uz')">🇺🇿 O'zbekcha</button>
            <button class="ios-input" style="text-align:left;" onclick="setLanguage('ru')">🇷🇺 Русский</button>
            <button class="ios-input" style="text-align:left;" onclick="setLanguage('en')">🇺🇸 English</button>
        </div>
    </div>

    <!-- SECTION: PREMIUM -->
    <div id="screen-premium" class="screen">
        <div class="app-header">
            <h1 class="app-title">Premium</h1>
        </div>
        <div class="ios-card" style="background: linear-gradient(135deg, #1C1C1E, #2C2C2E); color:#FFF;">
            <div style="font-size: 24px; margin-bottom: 8px;">💎 Statusingiz</div>
            <p style="color:var(--ios-subtext); margin:0;">Oddiy foydalanuvchi (30 kunlik bepul limit: 72 / 3 ta)</p>
        </div>
        
        <div class="ios-card">
            <div class="card-top">
                <div>
                    <h3 class="card-title">Kunlik Cheksiz</h3>
                    <span style="font-size:12px; color:var(--ios-subtext);">24 soat mutlaqo cheksiz</span>
                </div>
                <span style="font-weight:700; color:var(--ios-accent);">7 000 so'm</span>
            </div>
            <button class="submit-btn" style="padding:8px 12px; font-size:14px;">Faollashtirish</button>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="tab-bar">
        <button class="tab-item" onclick="switchScreen('create', this)">
            <span class="icon">➕</span>
            <span>Yaratish</span>
        </button>
        <button class="tab-item active" onclick="switchScreen('library', this)">
            <span class="icon">📚</span>
            <span>Kutubxona</span>
        </button>
        <button class="tab-item" onclick="switchScreen('settings', this)">
            <span class="icon">⚙️</span>
            <span>Sozlamalar</span>
        </button>
        <button class="tab-item" onclick="switchScreen('premium', this)">
            <span class="icon">👑</span>
            <span>Premium</span>
        </button>
    </nav>

    <script>
        const BASE_URL = ""; // API manzili
        const userId = 12345;
        let currentLang = 'uz';

        function switchScreen(screenId, btn) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            
            document.getElementById(`screen-${screenId}`).classList.add('active');
            if(btn) btn.classList.add('active');

            if(screenId === 'library') loadQuizzes();
        }

        function switchTab(btn, tabType) {
            document.querySelectorAll('.segment-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if(tabType === 'tests') loadQuizzes();
            if(tabType === 'public') loadPublicQuizzes();
            if(tabType === 'cards') loadFlashcards();
        }

        async function loadQuizzes() {
            const container = document.getElementById('lib-content-area');
            container.innerHTML = '<div class="loader">⏳ Yuklanmoqda...</div>';

            try {
                const res = await fetch(`${BASE_URL}/api/quizzes?user_id=${userId}`);
                const data = await res.json();

                if (data.status === 'ok' && data.quizzes.length > 0) {
                    let html = '';
                    data.quizzes.forEach(q => {
                        const percent = q.last_percent >= 0 ? q.last_percent : 0;
                        html += `
                            <div class="ios-card">
                                <div class="card-top">
                                    <h3 class="card-title">${q.title}</h3>
                                    <div class="action-group">
                                        <button class="icon-btn" onclick="togglePublic('${q.id}')">🌐</button>
                                        <button class="icon-btn" onclick="startQuiz('${q.id}')">▶️</button>
                                        <button class="icon-btn btn-del" onclick="deleteQuiz('${q.id}')">🗑️</button>
                                    </div>
                                </div>
                                <div class="progress-row">
                                    <div class="progress-line-container">
                                        <div class="progress-line-bar" style="width: ${percent}%;"></div>
                                    </div>
                                    <span style="font-size:12px; font-weight:700; color:var(--ios-accent);">${percent}%</span>
                                </div>
                                <div class="card-footer">
                                    <span>Savollar: ${q.total}</span>
                                    <span>ID: ${q.id}</span>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p style="text-align:center; color:var(--ios-subtext);">Testlar topilmadi</p>';
                }
            } catch (e) {
                // Namoyish uchun demo kartochkalar
                container.innerHTML = `
                    <div class="ios-card">
                        <div class="card-top">
                            <h3 class="card-title">Xorijiy Til_1</h3>
                            <div class="action-group">
                                <button class="icon-btn">🌐</button>
                                <button class="icon-btn">▶️</button>
                                <button class="icon-btn btn-del">🗑️</button>
                            </div>
                        </div>
                        <div class="progress-row">
                            <div class="progress-line-container"><div class="progress-line-bar" style="width: 0%;"></div></div>
                            <span style="font-size:12px; font-weight:700; color:var(--ios-accent);">0%</span>
                        </div>
                        <div class="card-footer">
                            <span>Savollar: 36</span>
                            <span>ID: 1786209817</span>
                        </div>
                    </div>
                `;
            }
        }

        function loadPublicQuizzes() {
            document.getElementById('lib-content-area').innerHTML = '<p style="text-align:center; color:var(--ios-subtext);">Ommaviy testlar ro\'yxati...</p>';
        }

        function loadFlashcards() {
            document.getElementById('lib-content-area').innerHTML = '<p style="text-align:center; color:var(--ios-subtext);">Flesh-kartochkalar ro\'yxati...</p>';
        }

        function updateFileName(input) {
            if(input.files.length > 0) {
                document.getElementById('upload-text').innerText = input.files[0].name;
            }
        }

        function setLanguage(lang) {
            alert("Til o'zgartirildi: " + lang);
        }

        // Boshlang'ich yuklash
        loadQuizzes();
    </script>
</body>
</html>
