<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Style Interface</title>
    <style>
        /* iOS SF Pro Shrift Tizimi va Bazaviy Stil */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f2f2f7;
            color: #000000;
            padding-bottom: 100px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 430px; /* iPhone ekran o'lchami */
            min-height: 100vh;
            padding: 16px;
            position: relative;
        }

        /* Header */
        header {
            margin-top: 20px;
            margin-bottom: 16px;
        }

        header h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Segmented Control (Silliq Tab) */
        .segmented-control {
            display: flex;
            background: rgba(120, 120, 128, 0.12);
            padding: 2px;
            border-radius: 9px;
            margin-bottom: 24px;
            position: relative;
        }

        .segment-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 7px 0;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            z-index: 2;
            transition: color 0.2s ease;
        }

        .segment-btn.active {
            font-weight: 600;
        }

        .segment-bg {
            position: absolute;
            top: 2px;
            left: 2px;
            width: calc(50% - 2px);
            height: calc(100% - 4px);
            background: #ffffff;
            border-radius: 7px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 3px 1px rgba(0, 0, 0, 0.04);
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 1;
        }

        /* Grouped List Cards (Apple Sozlamalar Uslubi) */
        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            color: #6c6c70;
            margin-left: 12px;
            margin-bottom: 6px;
            font-weight: 400;
        }

        .list-group {
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        .list-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 0.5px solid rgba(60, 60, 67, 0.12);
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item:active {
            background: #e5e5ea;
        }

        .item-icon {
            font-size: 20px;
            margin-right: 12px;
            width: 30px;
            text-align: center;
        }

        .item-content {
            flex: 1;
        }

        .item-title {
            font-size: 16px;
            font-weight: 400;
        }

        .item-subtitle {
            font-size: 12px;
            color: #8e8e93;
            margin-top: 2px;
        }

        .chevron {
            color: #c7c7cc;
            font-size: 18px;
            font-weight: 600;
        }

        /* Floating Glassmorphism Bottom Bar */
        .tab-bar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 398px;
            height: 64px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 32px;
            border: 0.5px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #8e8e93;
            font-size: 10px;
            gap: 4px;
            transition: color 0.2s ease, transform 0.1s ease;
        }

        .tab-item:active {
            transform: scale(0.92);
        }

        .tab-item.active {
            color: #007aff; /* Apple standart ko'k rangi */
        }

        .tab-icon {
            font-size: 20px;
        }

        /* Bottom Sheet (Modal) */
        .backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 200;
        }

        .bottom-sheet {
            position: fixed;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 12px 20px 40px 20px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
            transition: bottom 0.35s cubic-bezier(0.15, 0.85, 0.35, 1.2);
            z-index: 201;
        }

        .sheet-grabber {
            width: 36px;
            height: 5px;
            background: #e5e5ea;
            border-radius: 3px;
            margin: 0 auto 16px auto;
        }

        .sheet-active .backdrop {
            opacity: 1;
            pointer-events: auto;
        }

        .sheet-active .bottom-sheet {
            bottom: 0;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Sozlamalar</h1>
        </header>

        <!-- Segmented Control -->
        <div class="segmented-control">
            <div class="segment-bg" id="segmentBg"></div>
            <button class="segment-btn active" onclick="switchTab(0)">Asosiy</button>
            <button class="segment-btn" onclick="switchTab(1)">Qo'shimcha</button>
        </div>

        <!-- Grouped List -->
        <div class="section-title">Umumiy menyu</div>
        <div class="list-group">
            {% for item in items %}
            <div class="list-item" onclick="openSheet('{{ item.title }}')">
                <div class="item-icon">{{ item.icon }}</div>
                <div class="item-content">
                    <div class="item-title">{{ item.title }}</div>
                    <div class="item-subtitle">{{ item.subtitle }}</div>
                </div>
                <div class="chevron">›</div>
            </div>
            {% endfor %}
        </div>

        <!-- Floating Glassmorphism Tab Bar -->
        <nav class="tab-bar">
            <a href="#" class="tab-item active">
                <span class="tab-icon">🏠</span>
                <span>Bosh sahifa</span>
            </a>
            <a href="#" class="tab-item">
                <span class="tab-icon">🔍</span>
                <span>Qidiruv</span>
            </a>
            <a href="#" class="tab-item">
                <span class="tab-icon">👤</span>
                <span>Profil</span>
            </a>
        </nav>
    </div>

    <!-- Bottom Sheet Modal -->
    <div id="sheetWrapper">
        <div class="backdrop" onclick="closeSheet()"></div>
        <div class="bottom-sheet">
            <div class="sheet-grabber"></div>
            <h2 id="sheetTitle" style="font-size: 20px; font-weight: 600; margin-bottom: 8px;">Panel Sarlavhasi</h2>
            <p style="color: #8e8e93; font-size: 15px; line-height: 1.4;">
                Bu yerda iOS uslubidagi bottom sheet modalining kontenti joylashadi. Pastga tortib yoki fonni bosib yopish mumkin.
            </p>
        </div>
    </div>

    <script>
        // Segmented Control Animatsiyasi
        function switchTab(index) {
            const bg = document.getElementById('segmentBg');
            const buttons = document.querySelectorAll('.segment-btn');
            
            buttons.forEach((btn, i) => {
                if (i === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            bg.style.transform = `translateX(${index * 100}%)`;
        }

        // Bottom Sheet Boshqaruvi
        function openSheet(title) {
            document.getElementById('sheetTitle').innerText = title;
            document.body.classList.add('sheet-active');
        }

        function closeSheet() {
            document.body.classList.remove('sheet-active');
        }
    </script>
</body>
</html>
