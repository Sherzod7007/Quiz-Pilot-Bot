<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Pilot Super Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --success-color: #22c55e;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 80px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .btn {
            width: 100%;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn:active {
            background-color: var(--accent-hover);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-outline:active {
            background-color: var(--border-color);
        }

        .support-card {
            text-align: center;
            margin-top: 24px;
        }

        .support-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .support-desc {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 14px;
        }

        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }

        .nav-item {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">🚀 Quiz Pilot</div>
        <div id="userStatus" style="font-size: 12px; color: var(--accent-color);">PRO ✨</div>
    </div>

    <!-- Asosiy Ilm/Test Yaratish Bolimi -->
    <div class="card">
        <h3 style="margin-bottom: 12px;" id="lblCreateQuiz">Yangi test yaratish</h3>
        <button class="btn" onclick="openCreateModal()" id="btnStartCreate">
            ➕ Test yaratish
        </button>
    </div>

    <!-- Admin Bilan Bog'lanish Bolimi -->
    <div class="card support-card">
        <div class="support-title" id="lblSupportTitle">💬 Yordam va Qo'llab-quvvatlash</div>
        <div class="support-desc" id="lblSupportDesc">Savollaringiz yoki muammo bormi? Administrator bilan to'g'ridan-to'g'ri bog'laning.</div>
        <button class="btn btn-outline" onclick="contactAdmin()" id="btnContactAdmin">
            ✉️ Admin bilan bog'lanish
        </button>
    </div>

    <!-- Pastki Navigatsiya Bar -->
    <div class="footer-nav">
        <a href="#" class="nav-item active" id="navHome">🏠 Bosh sahifa</a>
        <a href="#" class="nav-item" id="navPublic">🌐 Ommaviy</a>
        <a href="#" class="nav-item" id="navTariffs">👑 Tariflar</a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Mini App ni to'liq ekranda ochish

        const userId = tg.initDataUnsafe?.user?.id || 0;
        const userLang = tg.initDataUnsafe?.user?.language_code || 'uz';

        // Tillar lug'ati UI uchun
        const i18n = {
            uz: {
                createQuiz: "Yangi test yaratish",
                startCreate: "➕ Test yaratish",
                supportTitle: "💬 Yordam va Qo'llab-quvvatlash",
                supportDesc: "Savollaringiz yoki muammo bormi? Administrator bilan to'g'ridan-to'g'ri bog'laning.",
                contactAdmin: "✉️ Admin bilan bog'lanish",
                home: "🏠 Bosh sahifa",
                public: "🌐 Ommaviy",
                tariffs: "👑 Tariflar",
                alertSent: "Admin bilan muloqot oynasi ochildi. Telegram orqali xabaringizni yozib qoldiring!"
            },
            ru: {
                createQuiz: "Создать новый тест",
                startCreate: "➕ Создать тест",
                supportTitle: "💬 Помощь и Поддержка",
                supportDesc: "Есть вопросы или проблемы? Свяжитесь с администратором напрямую.",
                contactAdmin: "✉️ Связаться с админом",
                home: "🏠 Главная",
                public: "🌐 Общие",
                tariffs: "👑 Тарифы",
                alertSent: "Диалог с админом открыт. Напишите ваше сообщение в чате Telegram!"
            },
            en: {
                createQuiz: "Create New Quiz",
                startCreate: "➕ Create Quiz",
                supportTitle: "💬 Help & Support",
                supportDesc: "Have questions or issues? Contact the administrator directly.",
                contactAdmin: "✉️ Contact Admin",
                home: "🏠 Home",
                public: "🌐 Public",
                tariffs: "👑 Pricing",
                alertSent: "Support chat initiated. Please type your message in the Telegram chat!"
            }
        };

        const lang = i18n[userLang] ? userLang : 'uz';

        // Til bo'yicha UI larni o'rnatish
        document.getElementById('lblCreateQuiz').innerText = i18n[lang].createQuiz;
        document.getElementById('btnStartCreate').innerText = i18n[lang].startCreate;
        document.getElementById('lblSupportTitle').innerText = i18n[lang].supportTitle;
        document.getElementById('lblSupportDesc').innerText = i18n[lang].supportDesc;
        document.getElementById('btnContactAdmin').innerText = i18n[lang].contactAdmin;
        document.getElementById('navHome').innerText = i18n[lang].home;
        document.getElementById('navPublic').innerText = i18n[lang].public;
        document.getElementById('navTariffs').innerText = i18n[lang].tariffs;

        // ADMIN BILAN BOG'LANISH FUNKSIYASI
        function contactAdmin() {
            const data = {
                action: "contact_admin",
                user_id: userId
            };

            // Telegram WebApp ga ma'lumot uzatish
            tg.sendData(JSON.stringify(data));
            
            // Foydalanuvchiga bildirishnoma ko'rsatib Mini App ni yopish
            tg.showAlert(i18n[lang].alertSent, function() {
                tg.close();
            });
        }

        function openCreateModal() {
            // Test yaratish funksiyasi
            console.log("Test yaratish bosildi");
        }
    </script>
</body>
</html>
